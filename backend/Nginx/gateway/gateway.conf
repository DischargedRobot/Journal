
events {
    worker_connections 1024;
}

http {
    
    map $http_origin $cors_origin {
        default "";
        "http://localhost:3000" $http_origin;
    }

    upstream auth_services { 
        server auth-service:9000;
        keepalive 32;
    }

    upstream main_services {
        server main-service:9010;
        keepalive 32;
    }

    server {
        listen 9090;
        server_name api.journal.gateway;

        # subrequest для auth_request (не пересекается с публичным /auth/*)
        location = /_verify {
            internal;
            proxy_pass_request_body off;
            proxy_set_header Authorization $http_authorization;
            proxy_method POST;
            proxy_pass http://auth_services/auth-service/v1/Auth/check-authtoken;
        }

        location ^~ /api/auth/v1/Auth/register {
                # Preflight — без токена
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $cors_origin;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept";
                add_header Access-Control-Allow-Credentials "true";
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                return 204;
            }

            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
proxy_set_header Host $host;
proxy_set_header Content-Type $content_type;
proxy_http_version 1.1;
            proxy_pass http://auth_services/auth-service/v1/Auth/register;
        }
        location = /api/auth/v1/Auth/log-in {
                # Preflight — без токена
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $cors_origin;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept";
                add_header Access-Control-Allow-Credentials "true";
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                return 204;
            }

            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
proxy_set_header Host $host;
proxy_set_header Content-Type $content_type;
proxy_http_version 1.1;
            proxy_pass http://auth_services/auth-service/v1/Auth/log-in;
        }

        # все /auth/* в auth_service без префикса /auth
        location ^~ /api/auth {
            # Preflight — без токена
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $cors_origin;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept";
                add_header Access-Control-Allow-Credentials "true";
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                return 204;
            }

            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;

            auth_request /_verify;
            auth_request_set $auth_json $upstream_http_x_error_json;
            auth_request_set $trace_id $upstream_http_x_trace_id;
            auth_request_set $user_id $upstream_http_x_user_id;

            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-Trace-Id $trace_id;

            proxy_pass http://auth_services/auth-service;

            error_page 401 = @err401;
        }

        # все /main/* в main_service без префикса /main
        location ^~ /api/main {
            # Preflight — без токена
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $cors_origin;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept";
                add_header Access-Control-Allow-Credentials "true";
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                return 204;
            }

            # всегда разрешаем origin
            add_header Access-Control-Allow-Origin      $cors_origin always;
            # всегда разрешаем credentials
            add_header Access-Control-Allow-Credentials "true" always;

            auth_request /_verify;
            auth_request_set $auth_json $upstream_http_x_error_json;
            auth_request_set $trace_id $upstream_http_x_trace_id;
            auth_request_set $user_id $upstream_http_x_user_id;

            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-Trace-Id $trace_id;

            proxy_pass http://main_services/main-service;

            error_page 401 = @err401;
        }

        location @err401 {
            internal;
            default_type application/json;
            add_header X-Trace-Id $trace_id;
            return 401 $auth_json;
        }
    }
}